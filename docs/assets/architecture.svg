<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" fill="none" role="img" aria-labelledby="title description">
  <title id="title">CAT OSINT system architecture</title>
  <desc id="description">Public APIs flow through bounded C++ connectors into source attributed records, then to a local language model and a dashboard with original source links.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#262626" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#181818"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D6B678"/>
      <stop offset="1" stop-color="#F0E2C2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#C9B483" stroke-width="1.5" fill="none"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="920" fill="#090909"/>
  <rect width="1600" height="920" fill="url(#grid)" opacity=".55"/>
  <path d="M0 180H1600M0 825H1600" stroke="#343434"/>
  <text x="88" y="82" fill="#D9C79C" font-family="Consolas,monospace" font-size="15" letter-spacing="3">CAT OSINT / SYSTEM MAP</text>
  <text x="88" y="132" fill="#F5F3EE" font-family="Arial,sans-serif" font-size="38" font-weight="700">A traceable path from source to summary</text>
  <text x="89" y="164" fill="#929292" font-family="Arial,sans-serif" font-size="17">User initiated collection. Bounded processing. Local inference. Original sources remain in reach.</text>
  <g filter="url(#shadow)">
    <rect x="72" y="236" width="332" height="500" rx="8" fill="url(#panel)" stroke="#46423B"/>
    <rect x="432" y="236" width="390" height="500" rx="8" fill="url(#panel)" stroke="#746344"/>
    <rect x="850" y="236" width="310" height="500" rx="8" fill="url(#panel)" stroke="#46423B"/>
    <rect x="1188" y="236" width="340" height="500" rx="8" fill="url(#panel)" stroke="#46423B"/>
  </g>
  <path d="M404 486H422" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M822 486H840" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1160 486H1178" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Consolas,monospace">
    <text x="100" y="286" fill="#D9C79C" font-size="13" letter-spacing="2">01 / PUBLISHED SOURCES</text>
    <text x="460" y="286" fill="#D9C79C" font-size="13" letter-spacing="2">02 / C++20 ENGINE</text>
    <text x="878" y="286" fill="#D9C79C" font-size="13" letter-spacing="2">03 / LOCAL MODEL</text>
    <text x="1216" y="286" fill="#D9C79C" font-size="13" letter-spacing="2">04 / DASHBOARD</text>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="100" y="316" width="276" height="94" rx="5" fill="#202020" stroke="#383838"/>
    <circle cx="126" cy="346" r="6" fill="#D6B678"/>
    <text x="145" y="351" fill="#F2F0EA" font-size="19" font-weight="700">USGS earthquakes</text>
    <text x="122" y="382" fill="#999" font-size="14">Past day feed with source links</text>
    <rect x="100" y="428" width="276" height="94" rx="5" fill="#202020" stroke="#383838"/>
    <circle cx="126" cy="458" r="6" fill="#D6B678"/>
    <text x="145" y="463" fill="#F2F0EA" font-size="19" font-weight="700">NWS weather alerts</text>
    <text x="122" y="494" fill="#999" font-size="14">Active public alerts</text>
    <rect x="100" y="540" width="276" height="94" rx="5" fill="#202020" stroke="#383838"/>
    <circle cx="126" cy="570" r="6" fill="#D6B678"/>
    <text x="145" y="575" fill="#F2F0EA" font-size="19" font-weight="700">NASA EONET</text>
    <text x="122" y="606" fill="#999" font-size="14">Open natural events</text>
    <text x="100" y="686" fill="#888" font-size="13">HTTPS JSON / per provider limits</text>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="460" y="316" width="334" height="76" rx="5" fill="#202020" stroke="#383838"/>
    <text x="482" y="347" fill="#F2F0EA" font-size="18" font-weight="700">Connector mapping</text>
    <text x="482" y="375" fill="#999" font-size="14">Parse paths into typed records</text>
    <rect x="460" y="407" width="334" height="76" rx="5" fill="#202020" stroke="#383838"/>
    <text x="482" y="438" fill="#F2F0EA" font-size="18" font-weight="700">Bounded fair share</text>
    <text x="482" y="466" fill="#999" font-size="14">Intervals, retry delays, batch cap</text>
    <rect x="460" y="498" width="334" height="76" rx="5" fill="#202020" stroke="#383838"/>
    <text x="482" y="529" fill="#F2F0EA" font-size="18" font-weight="700">Provenance retained</text>
    <text x="482" y="557" fill="#999" font-size="14">Identity, original link, observed time</text>
    <rect x="460" y="589" width="334" height="76" rx="5" fill="#202020" stroke="#383838"/>
    <text x="482" y="620" fill="#F2F0EA" font-size="18" font-weight="700">Loopback API</text>
    <text x="482" y="648" fill="#999" font-size="14">127.0.0.1:8765</text>
    <text x="460" y="699" fill="#888" font-size="13">C++20 / WinHTTP on Windows</text>
  </g>
  <g font-family="Arial,sans-serif">
    <circle cx="1005" cy="386" r="75" fill="#211F1B" stroke="#8A7650"/>
    <path d="M960 388L966 343L990 359H1020L1044 343L1050 388C1050 424 1030 446 1005 450C980 446 960 424 960 388Z" fill="#EEEAE1"/>
    <path d="M973 386H993V402H973ZM1017 386H1037V402H1017ZM993 391H1017" stroke="#101010" stroke-width="6" fill="none"/>
    <path d="M1005 405L999 412H1011Z" fill="#171717"/>
    <text x="1005" y="500" fill="#F2F0EA" font-size="19" font-weight="700" text-anchor="middle">OpenAI compatible</text>
    <text x="1005" y="530" fill="#AAA" font-size="15" text-anchor="middle">Bionic / LM Studio / Ollama</text>
    <text x="1005" y="560" fill="#AAA" font-size="15" text-anchor="middle">Jan / LocalAI / others</text>
    <rect x="880" y="601" width="250" height="60" rx="5" fill="#202020" stroke="#383838"/>
    <text x="1005" y="628" fill="#D9C79C" font-family="Consolas,monospace" font-size="12" text-anchor="middle">LOCAL HOST ONLY</text>
    <text x="1005" y="648" fill="#999" font-size="13" text-anchor="middle">Model output is advisory</text>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="1216" y="316" width="284" height="80" rx="5" fill="#202020" stroke="#383838"/>
    <text x="1240" y="349" fill="#F2F0EA" font-size="18" font-weight="700">Collected records</text>
    <text x="1240" y="378" fill="#999" font-size="14">Searchable, source linked</text>
    <rect x="1216" y="414" width="284" height="80" rx="5" fill="#202020" stroke="#383838"/>
    <text x="1240" y="447" fill="#F2F0EA" font-size="18" font-weight="700">Model analysis</text>
    <text x="1240" y="476" fill="#999" font-size="14">Separate from observed data</text>
    <rect x="1216" y="512" width="284" height="80" rx="5" fill="#202020" stroke="#383838"/>
    <text x="1240" y="545" fill="#F2F0EA" font-size="18" font-weight="700">Configuration status</text>
    <text x="1240" y="574" fill="#999" font-size="14">No invented activity or records</text>
    <rect x="1216" y="623" width="284" height="42" rx="4" fill="#2A261E" stroke="#766343"/>
    <text x="1358" y="650" fill="#D9C79C" font-family="Consolas,monospace" font-size="12" text-anchor="middle">RUN ONLY WHEN REQUESTED</text>
  </g>
  <rect x="72" y="778" width="1456" height="1" fill="#343434"/>
  <text x="88" y="825" fill="#D9C79C" font-family="Consolas,monospace" font-size="13" letter-spacing="2">DESIGN GUARANTEE</text>
  <text x="88" y="862" fill="#E5E2DB" font-family="Arial,sans-serif" font-size="20">Every summary begins with bounded records and ends with a path back to its source.</text>
  <text x="1512" y="862" fill="#777" font-family="Consolas,monospace" font-size="12" text-anchor="end">CAT OSINT / 01</text>
</svg>
